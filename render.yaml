services:
  - type: web
    name: smart-mess
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: HOME_COLLEGE_NAME
        value: "Bannari Amman Institute of Technology"
      - key: ADMIN_NAME
        value: "Mess Administrator"
      - key: ADMIN_EMAIL
        value: "admin@mess.local"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: "test"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_RATE_LIMIT_MAX
        value: "50"
